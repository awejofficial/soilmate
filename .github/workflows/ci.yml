name: SoilMate CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Plant Reference Dataset JSON
        run: |
          python -c "import json; data=json.load(open('data/plants.json')); assert len(data) >= 12; print(f'Validated {len(data)} plants in dataset.')"

      - name: Run Pytest Automated Suite
        run: |
          pytest -v --tb=short tests/
